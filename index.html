    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow: hidden;
        }

        body {
            font-family: 'Yuji Syuku', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
            line-height: 1.8;
            color: #cfcbc4;
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            overflow: hidden;
        }

        p {
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        main {
            animation: appear 2s ease 0.3s backwards,
                       vanish 1.5s ease 19s forwards;
        }

        @keyframes appear {
            from { opacity: 0; }
        }

        @keyframes vanish {
            to { opacity: 0; }
        }

        span {
            display: inline-block;
            position: relative;
            animation: fall var(--d) linear var(--t) forwards;
        }

        /* The thread each character hangs from, fading into the dark above it. */
        span::before {
            content: "";
            position: absolute;
            left: calc(50% - 0.5px);
            bottom: calc(100% - 9px);
            width: 1px;
            height: 20px;
            background: linear-gradient(to top, #fff, transparent);
            opacity: 0.22;
            transform-origin: top;
            z-index: -1;
            animation: snap 0.22s linear calc(var(--t) - 0.1s) forwards;
        }

        /* One hard frame of spark, then the cut end whips upward. */
        @keyframes snap {
            0%   { opacity: 0.22; transform: scaleY(1); animation-timing-function: steps(1, end); }
            25%  { opacity: 1; transform: scaleY(1) scaleX(3); }
            45%  { opacity: 1; transform: scaleY(1) scaleX(1); animation-timing-function: cubic-bezier(0.3, 0, 0.1, 1); }
            100% { opacity: 0; transform: scaleY(0) scaleX(1); }
        }

        /* Slack, then the give, then gravity: vertical travel is sampled along a
           parabola while drift and spin stay linear. */
        @keyframes fall {
            0%   { transform: translate(0, 0) rotate(0deg); animation-timing-function: ease-out; }
            5%   { transform: translate(0, 3px) rotate(calc(var(--r) * 0.06)); }
            12%  { transform: translate(calc(var(--x) * 0.02), 8px) rotate(calc(var(--r) * 0.15)); }
            27%  { transform: translate(calc(var(--x) * 0.26), calc(var(--y) * 0.0625)) rotate(calc(var(--r) * 0.28)); }
            43%  { transform: translate(calc(var(--x) * 0.5), calc(var(--y) * 0.25)) rotate(calc(var(--r) * 0.49)); }
            60%  { transform: translate(calc(var(--x) * 0.75), calc(var(--y) * 0.5625)) rotate(calc(var(--r) * 0.71)); }
            76%  { transform: translate(var(--x), var(--y)) rotate(calc(var(--r) * 0.93)); animation-timing-function: ease-out; }
            84%  { transform: translate(var(--x), calc(var(--y) * 0.94)) rotate(calc(var(--r) * 0.97)); animation-timing-function: ease-in; }
            91%  { transform: translate(var(--x), var(--y)) rotate(calc(var(--r) * 0.99)); animation-timing-function: ease-out; }
            96%  { transform: translate(var(--x), calc(var(--y) * 0.985)) rotate(var(--r)); animation-timing-function: ease-in; }
            100% { transform: translate(var(--x), var(--y)) rotate(var(--r)); }
        }
    </style>
